<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🌸 April Fool's Surprise | Love Message 🌸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', 'Poppins', 'Arial', sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0f 100%);
            color: white;
        }

        /* Background image */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('b80c8a4b2fff4744b3460b7ceadb61cc.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 5;
            pointer-events: none;
        }

        .bg-overlay.active {
            opacity: 1;
        }

        /* main container for centering */
        .container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.6s ease;
        }

        /* Flower Button */
        .flower-btn {
            position: relative;
            padding: 14px 32px;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fad0c4 100%);
            color: #5e2a3e;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.4), 0 0 0 2px rgba(255, 220, 150, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            letter-spacing: 1px;
            overflow: hidden;
            z-index: 25;
        }

        .flower-btn:active {
            transform: scale(0.97);
        }

        /* flower burst particles */
        .flower-particle {
            position: absolute;
            width: 18px;
            height: 18px;
            background: radial-gradient(circle, #ffb7c5, #ff6f91);
            border-radius: 50%;
            pointer-events: none;
            z-index: 30;
            box-shadow: 0 0 6px #ffb7c5;
            animation: bloomFloat 1.2s ease-out forwards;
        }

        @keyframes bloomFloat {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            40% {
                transform: scale(1.2) rotate(120deg);
                opacity: 0.9;
            }
            100% {
                transform: scale(2.5) rotate(240deg);
                opacity: 0;
            }
        }

        /* Message Card */
        .message-card {
            position: absolute;
            text-align: center;
            width: 88%;
            max-width: 550px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2rem 1.8rem;
            border: 2px solid rgba(255, 105, 130, 0.6);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
            z-index: 35;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        .message-card.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .message-card.hidden {
            opacity: 0 !important;
            pointer-events: none;
        }

        .error-text {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffb347, #ff6b6b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .message-body {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #ffdfc5;
            margin-top: 10px;
        }

        .highlight-name {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(145deg, #ffb347, #ff6f61);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            border-bottom: 3px dashed #ff8c8c;
            padding: 0 6px;
            display: inline-block;
        }

        /* Ready Button */
        .ready-btn {
            margin-top: 25px;
            padding: 12px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 100, 100, 0.4);
            font-family: inherit;
        }

        .ready-btn:active {
            transform: scale(0.96);
        }

        /* GIFT SELECTION SECTION */
        .gift-section {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            width: 94%;
            max-width: 580px;
            background: linear-gradient(135deg, rgba(30, 20, 40, 0.98), rgba(20, 15, 30, 0.98));
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 1.2rem 1rem;
            z-index: 45;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.5s ease;
            pointer-events: none;
            border: 2px solid rgba(255, 180, 100, 0.7);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .gift-section.active {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }

        .gift-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #FFD966, #FF9966);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .gift-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 0.5rem;
        }

        .gift-card {
            background: rgba(255, 245, 220, 0.18);
            border-radius: 28px;
            padding: 0.9rem 0.7rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            width: 95px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,200,150,0.6);
            -webkit-tap-highlight-color: transparent;
        }

        .gift-card:active {
            transform: scale(0.95);
            background: rgba(255, 220, 150, 0.45);
        }

        .gift-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .gift-label {
            margin-top: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #FFE4B5;
        }

        /* April Fool's Surprise Message */
        .fool-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000000ea;
            backdrop-filter: blur(20px);
            padding: 2rem 1.5rem;
            border-radius: 60px;
            text-align: center;
            z-index: 200;
            border: 3px solid #ffaa44;
            box-shadow: 0 0 60px rgba(255,100,0,0.9);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .fool-message.show {
            opacity: 1;
        }

        .fool-message div:first-child {
            font-size: 3rem;
        }
        .fool-message div:nth-child(2) {
            font-size: 1.2rem;
            margin-top: 0.8rem;
        }
        .fool-message div:nth-child(3) {
            font-size: 1rem;
            margin-top: 0.6rem;
        }
        .fool-message div:last-child {
            font-size: 0.95rem;
            margin-top: 0.8rem;
        }

        /* I Love You Message */
        .love-message {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(255, 80, 100, 0.96), rgba(255, 50, 80, 0.96));
            backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: 70px;
            text-align: center;
            z-index: 250;
            border: 4px solid #ffdd99;
            box-shadow: 0 0 100px rgba(255, 100, 100, 0.9);
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: auto;
            width: 85%;
            max-width: 450px;
        }

        .love-message.show {
            opacity: 1;
        }

        .love-message .heart-icon {
            font-size: 4rem;
            animation: heartbeat 1s ease-in-out infinite;
        }

        .love-message h1 {
            font-size: 2.5rem;
            margin: 0.8rem 0;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .love-message p {
            font-size: 1.2rem;
            color: #fff0d0;
            margin-top: 0.5rem;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Navigation Blocker - Only appears when love message shows */
        .nav-blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 249;
            display: none;
            pointer-events: auto;
        }

        .nav-blocker.active {
            display: block;
        }

        /* Confirmation Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: linear-gradient(145deg, #2a1e2e, #1a1220);
            border-radius: 48px;
            padding: 1.8rem 1.5rem;
            max-width: 340px;
            width: 85%;
            text-align: center;
            border: 2px solid #ff9966;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            color: #ffbb88;
        }

        .modal-gift-preview {
            width: 80px;
            margin: 0.6rem auto;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .modal-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        .confirm-btn {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
        }

        .cancel-btn {
            background: #3a2a3a;
            color: #ffccaa;
            border: 1px solid #ffaa77;
        }

        /* Balloons */
        .balloon {
            position: absolute;
            bottom: -120px;
            width: 40px;
            height: 56px;
            border-radius: 50%;
            animation: floatUp 7s linear forwards;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.1);
            z-index: 12;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-130vh) rotate(20deg); opacity: 0; }
        }

        .floating-petal {
            position: absolute;
            pointer-events: none;
            z-index: 15;
            font-size: 22px;
            animation: petalDrift 4.5s linear forwards;
        }

        @keyframes petalDrift {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Stickers - FIXED DISPLAY */
        .sticker {
            position: absolute;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 25;
            pointer-events: none;
        }

        /* Left Sticker - Larger, NO animation */
        #leftSticker { 
            left: 2%; 
            bottom: 6%; 
            width: 95px;
            height: auto;
            transform: rotate(-8deg);
        }

        /* Right Sticker - Larger with expand/rotate animation */
        #rightSticker {
            right: 2%;
            top: 10%;
            width: 200px;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
            animation: expandRotate 2s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes expandRotate {
            0% {
                transform: scale(1) rotate(0deg);
            }
            
            50% {
                transform: scale(1.35) rotate(12deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .sticker.visible {
            opacity: 1;
        }

        .fade-out { opacity: 0; pointer-events: none; }

        @keyframes gentleWobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(2deg); }
            75% { transform: rotate(-2deg); }
            100% { transform: rotate(0deg); }
        }

        ::-webkit-scrollbar {
            display: none;
        }
        
        @media (max-width: 480px) {
            .gift-card { width: 80px; padding: 0.6rem 0.4rem; }
            .gift-img { width: 50px; height: 50px; }
            .gift-label { font-size: 0.65rem; }
            .gift-title { font-size: 1.3rem; }
            .error-text { font-size: 1.8rem; }
            .message-body { font-size: 1.1rem; }
            .highlight-name { font-size: 1.5rem; }
            .flower-btn { padding: 12px 28px; font-size: 1.2rem; }
            #rightSticker { width: 200px; top: 8%; }
            #leftSticker { width: 100px; }
            .love-message h1 { font-size: 1.8rem; }
            .love-message .heart-icon { font-size: 3rem; }
        }

        @media (min-width: 768px) {
            .error-text { font-size: 2.6rem; }
            .message-body { font-size: 1.5rem; }
            .highlight-name { font-size: 2rem; }
            #rightSticker { width: 120px; top: 12%; }
            #leftSticker { width: 110px; }
        }
    </style>
</head>
<body>

<div id="bgOverlay" class="bg-overlay"></div>

<div class="container" id="btnContainer">
    <button class="flower-btn" id="magicButton">
        ✿ Click Me ✿
    </button>
</div>

<!-- Message Card with Ready Button -->
<div id="messageBox" class="message-card">
    <div class="error-text">⚠️ ERROR 404 ⚠️</div>
    <div class="message-body">
        Too much personality detected in one user.<br>
        System cannot process <span id="dynamicName" class="highlight-name"></span>.<br>
        Please reduce awesomeness and try again 😭💖
    </div>
    <button id="readyButton" class="ready-btn">🎁 Are You Ready for Gift? 🎁</button>
</div>

<!-- GIFT SELECTION SECTION -->
<div id="giftSelection" class="gift-section">
    <div class="gift-title">🎁 SELECT A GIFT 🎁</div>
    <div class="gift-container">
        <div class="gift-card" data-gift="diamond">
            <img class="gift-img" src="ring.jpeg" alt="Diamond Ring" onerror="this.src='https://i.imgur.com/5qDqY8f.png'">
            <div class="gift-label">💎 Diamond Ring</div>
        </div>
        <div class="gift-card" data-gift="vacation">
            <img class="gift-img" src="flight.jpeg" alt="Vacation" onerror="this.src='https://i.imgur.com/KyZ9hYQ.png'">
            <div class="gift-label">✈️ Paradise Trip</div>
        </div>
        <div class="gift-card" data-gift="chocolate">
            <img class="gift-img" src="chocolate.jpeg" alt="Chocolate" onerror="this.src='https://i.imgur.com/Lz7kLpP.png'">
            <div class="gift-label">🍫 Luxury Chocolates</div>
        </div>
        <div class="gift-card" data-gift="surprise">
            <img class="gift-img" src="https://cdn-icons-png.flaticon.com/512/1998/1998592.png" alt="Mystery Box" onerror="this.src='https://i.imgur.com/JlP2kBV.png'">
            <div class="gift-label">🎁 Mystery Box</div>
        </div>
    </div>
</div>

<img id="leftSticker" class="sticker" src="images.png" alt="cute sticker" onerror="this.src='https://i.imgur.com/OdL0XPt.png'">
<img id="rightSticker" class="sticker" src="images1.png" alt="cute sticker" onerror="this.src='https://i.imgur.com/OdL0XPt.png'">

<!-- Navigation Blocker - Only appears when love message shows -->
<div id="navBlocker" class="nav-blocker"></div>

<!-- Audio elements -->
<audio id="audio1" preload="auto">
    <source src="alarm.mp3" type="audio/mpeg">
</audio>
<audio id="audio2" preload="auto">
    <source src="mixkit-small-man-crowd-laughing-423.wav" type="audio/wav">
</audio>
<audio id="audio3" preload="auto">
    <source src="Rayvanny_-_I_love_you_(Official_Music_Video)_SMS_SKIZA_8548826_to_811(128k) (1)_054843.m4a" type="audio/mpeg">
</audio>

<script>
    const girlName = "BRIDGET";
    
    const nameSpan = document.getElementById("dynamicName");
    const btn = document.getElementById("magicButton");
    const containerDiv = document.getElementById("btnContainer");
    const bgOverlay = document.getElementById("bgOverlay");
    const msgCard = document.getElementById("messageBox");
    const readyBtn = document.getElementById("readyButton");
    const leftSticker = document.getElementById("leftSticker");
    const rightSticker = document.getElementById("rightSticker");
    const audio1 = document.getElementById("audio1");
    const audio2 = document.getElementById("audio2");
    const audio3 = document.getElementById("audio3");
    const giftSection = document.getElementById("giftSelection");
    const navBlocker = document.getElementById("navBlocker");

    let currentPlayingAudio = null;
    let giftOpened = false;
    let isLoveMessageShowing = false;

    if (nameSpan) nameSpan.innerText = girlName;

    // Function to stop any currently playing audio
    function stopAllAudio() {
        if (currentPlayingAudio) {
            currentPlayingAudio.pause();
            currentPlayingAudio.currentTime = 0;
            currentPlayingAudio = null;
        }
        [audio1, audio2, audio3].forEach(audio => {
            if (!audio.paused) {
                audio.pause();
                audio.currentTime = 0;
            }
        });
    }

    // Function to play audio
    function playAudio(audioElement, onEndCallback = null) {
        if (currentPlayingAudio === audioElement && !audioElement.paused) return;
        
        if (currentPlayingAudio && currentPlayingAudio !== audioElement) {
            currentPlayingAudio.pause();
            currentPlayingAudio.currentTime = 0;
        }
        
        if (audioElement) {
            audioElement.currentTime = 0;
            audioElement.onended = onEndCallback;
            audioElement.play().catch(e => console.log("Audio play error:", e));
            currentPlayingAudio = audioElement;
        }
    }

    function randomRange(min, max) {
        return min + Math.random() * (max - min);
    }

    function getBalloonColor() {
        const palette = ["#FFB3BA", "#FFDFBA", "#FFFFBA", "#BAFFC9", "#BAE1FF", "#E0BBE4", "#FEC8D8", "#FFC2D9"];
        return palette[Math.floor(Math.random() * palette.length)];
    }

    function createFlowerExplosion(targetElement) {
        if (!targetElement) return;
        const rect = targetElement.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        for (let i = 0; i < 32; i++) {
            const petal = document.createElement("div");
            petal.classList.add("flower-particle");
            const angle = Math.random() * Math.PI * 2;
            const radius = randomRange(15, 90);
            petal.style.left = (centerX + Math.cos(angle) * radius) + "px";
            petal.style.top = (centerY + Math.sin(angle) * radius) + "px";
            petal.style.width = randomRange(8, 18) + "px";
            petal.style.height = petal.style.width;
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 1300);
        }
    }

    function createBalloons(count = 28) {
        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                const balloon = document.createElement("div");
                balloon.classList.add("balloon");
                balloon.style.left = Math.random() * 90 + 5 + "vw";
                balloon.style.background = getBalloonColor();
                const size = 34 + Math.random() * 22;
                balloon.style.width = size + "px";
                balloon.style.height = (size * 1.4) + "px";
                balloon.style.animationDuration = randomRange(5.5, 9) + "s";
                document.body.appendChild(balloon);
                setTimeout(() => balloon.remove(), 9500);
            }, i * 70);
        }
    }

    function createFloatingPetals() {
        const interval = setInterval(() => {
            const petals = ["🌸", "🌼", "🌷", "💮", "✨", "🎀", "💖", "🌺"];
            const petalDiv = document.createElement("div");
            petalDiv.className = "floating-petal";
            petalDiv.innerText = petals[Math.floor(Math.random() * petals.length)];
            petalDiv.style.left = Math.random() * 100 + "%";
            petalDiv.style.fontSize = randomRange(18, 34) + "px";
            petalDiv.style.bottom = "-20px";
            document.body.appendChild(petalDiv);
            setTimeout(() => petalDiv.remove(), 5000);
        }, 450);
        setTimeout(() => clearInterval(interval), 5200);
    }

    // April Fool's Surprise Message (plays audio2)
    function showAprilFoolsSurprise(chosenGift, onComplete) {
        const foolDiv = document.createElement('div');
        foolDiv.className = 'fool-message';
        foolDiv.innerHTML = `
            <div>🤡 APRIL FOOL! 🤡</div>
            <div>You thought you'd get ${chosenGift}? 😂</div>
            <div>The real gift is... my everlasting friendship! 💖✨</div>
            <div>🌸 Happy April 1st! 🌸</div>
        `;
        document.body.appendChild(foolDiv);
        setTimeout(() => foolDiv.classList.add('show'), 30);
        
        // Play audio2
        playAudio(audio2);
        
        // Confetti explosion
        for (let i = 0; i < 70; i++) {
            setTimeout(() => {
                const conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = randomRange(6, 18) + 'px';
                conf.style.height = conf.style.width;
                conf.style.background = `hsl(${Math.random() * 60 + 300}, 80%, 65%)`;
                conf.style.borderRadius = '50%';
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = Math.random() * 100 + '%';
                conf.style.zIndex = '999';
                conf.style.pointerEvents = 'none';
                conf.style.animation = 'bloomFloat 1s ease-out forwards';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 1000);
            }, i * 25);
        }
        
        // Show for 4 seconds, then call callback
        setTimeout(() => {
            foolDiv.style.opacity = '0';
            setTimeout(() => {
                foolDiv.remove();
                if (onComplete) onComplete();
            }, 500);
        }, 4200);
    }

    // I Love You Message - THIS ACTIVATES NAVIGATION BLOCKER
    function showLoveMessage() {
        isLoveMessageShowing = true;
        
        // ACTIVATE NAVIGATION BLOCKER - prevents any clicks outside the love message
        navBlocker.classList.add('active');
        
        const loveDiv = document.createElement('div');
        loveDiv.className = 'love-message';
        loveDiv.innerHTML = `
            <div class="heart-icon">❤️💖❤️</div>
            <h1>I LOVE YOU!</h1>
            <p>You mean the world<br>✨🌸FRIENDSHIP🌸✨</p>
            <p>Forever and always 💕</p>
        `;
        document.body.appendChild(loveDiv);
        setTimeout(() => loveDiv.classList.add('show'), 50);
        
        // Play audio3 - when it ends, remove navigation blocker
        playAudio(audio3, () => {
            // Audio finished - remove blocker after a short delay
            setTimeout(() => {
                navBlocker.classList.remove('active');
                isLoveMessageShowing = false;
            }, 500);
        });
        
        // Create floating hearts
        for (let i = 0; i < 300; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.innerText = '❤️', '💖';
                heart.style.position = 'absolute';
                heart.style.fontSize = randomRange(20, 50) + 'px';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.bottom = '-30px';
                heart.style.zIndex = '260';
                heart.style.pointerEvents = 'none';
                heart.style.animation = `floatUp ${randomRange(4, 8)}s linear forwards`;
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 8000);
            }, i * 100);
        }
    }

    // Show confirmation modal for gift selection
    function showConfirmationModal(giftType, giftLabel, giftImgSrc) {
        let modal = document.querySelector('.modal-overlay');
        if (!modal) {
            modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-box">
                    <h3>🎁 ARE YOU SURE? 🎁</h3>
                    <img id="modalGiftImg" class="modal-gift-preview" src="" alt="gift">
                    <p id="modalGiftText" style="color:#FFDDB3; font-size:1rem;">You are about to select this gift!</p>
                    <div class="modal-buttons">
                        <button class="modal-btn confirm-btn">YES, OPEN IT! 😍</button>
                        <button class="modal-btn cancel-btn">WAIT, NO! 😅</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        const modalImg = document.getElementById('modalGiftImg');
        const modalText = document.getElementById('modalGiftText');
        modalImg.src = giftImgSrc;
        modalText.innerHTML = `Are you sure you want the <strong style="color:#FFAA66">${giftLabel}</strong>?<br>Think twice... 😈`;
        
        modal.classList.add('show');
        
        const confirmBtn = modal.querySelector('.confirm-btn');
        const cancelBtn = modal.querySelector('.cancel-btn');
        
        const cleanup = () => {
            modal.classList.remove('show');
            confirmBtn.removeEventListener('click', onConfirm);
            cancelBtn.removeEventListener('click', onCancel);
        };
        
        const onConfirm = () => {
            cleanup();
            giftSection.classList.remove('active');
            
            // Show April Fool's surprise, then love message
            showAprilFoolsSurprise(giftLabel, () => {
                showLoveMessage();
            });
        };
        
        const onCancel = () => {
            cleanup();
        };
        
        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
    }
    
    function initGiftListeners() {
        const giftCardsElements = document.querySelectorAll('.gift-card');
        giftCardsElements.forEach(card => {
            card.removeEventListener('click', card._listener);
            const handler = (e) => {
                e.stopPropagation();
                const giftType = card.getAttribute('data-gift');
                const giftLabelElem = card.querySelector('.gift-label');
                const giftImgElem = card.querySelector('.gift-img');
                let giftLabel = giftLabelElem ? giftLabelElem.innerText : "Special Gift";
                let giftImgSrc = giftImgElem ? giftImgElem.src : "";
                showConfirmationModal(giftType, giftLabel, giftImgSrc);
            };
            card._listener = handler;
            card.addEventListener('click', handler);
        });
    }
    
    // Ready button click handler
    function openGiftSelection() {
        if (giftOpened) return;
        giftOpened = true;
        
        msgCard.classList.add('hidden');
        msgCard.classList.remove('visible');
        
        setTimeout(() => {
            giftSection.classList.add('active');
            initGiftListeners();
            
            const title = document.querySelector('.gift-title');
            if(title) {
                title.style.animation = 'none';
                title.offsetHeight;
                title.style.animation = 'gentleWobble 0.5s ease';
            }
        }, 300);
    }
    
    // Main animation sequence
    function startSurprise() {
        if (btn.disabled) return;
        btn.disabled = true;
        
        // Play audio1
        playAudio(audio1);
        
        createFlowerExplosion(btn);
        
        setTimeout(() => {
            containerDiv.classList.add("fade-out");
            setTimeout(() => containerDiv.style.display = "none", 400);
        }, 280);
        
        setTimeout(() => {
            if (bgOverlay) {
                bgOverlay.classList.add('active');
            }
            createBalloons(30);
            createFloatingPetals();
        }, 1000);
        
        // Show message card
        setTimeout(() => {
            msgCard.classList.add('visible');
            msgCard.classList.remove('hidden');
        }, 6200);
        
        // Show stickers
        setTimeout(() => {
            leftSticker.classList.add('visible');
            rightSticker.classList.add('visible');
        }, 6200);
        
        readyBtn.addEventListener('click', openGiftSelection);
    }
    
    btn.addEventListener("click", startSurprise);
    
    if (bgOverlay) {
        bgOverlay.style.backgroundImage = "url('b80c8a4b2fff4744b3460b7ceadb61cc.jpg')";
        bgOverlay.style.backgroundSize = "cover";
        bgOverlay.style.backgroundPosition = "center";
    }
    
    // Prevent back navigation only when love message is showing
    window.addEventListener('popstate', function(e) {
        if (isLoveMessageShowing) {
            history.pushState(null, null, location.href);
            e.preventDefault();
        }
    });
    history.pushState(null, null, location.href);
    
    // Image fallbacks
    document.querySelectorAll('.gift-img').forEach(img => {
        img.onerror = function() {
            this.src = "https://i.imgur.com/5qDqY8f.png";
        };
    });
    
    const leftStick = document.getElementById('leftSticker');
    const rightStick = document.getElementById('rightSticker');
    if (leftStick) leftStick.onerror = function() { this.src = "https://i.imgur.com/OdL0XPt.png"; };
    if (rightStick) rightStick.onerror = function() { this.src = "https://i.imgur.com/OdL0XPt.png"; };
    
    [audio1, audio2, audio3].forEach(audio => audio.load());
    
    // Ensure stickers are visible with correct styling
    console.log("Stickers loaded:", leftSticker, rightSticker);
</script>
</body>
</html>
